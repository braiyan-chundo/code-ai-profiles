name: Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release versioning
        run: |
          pnpm release:check
          pnpm test:release

      - name: Test scan controller
        run: pnpm test:scan

      - name: Test source update controller
        run: pnpm test:update

      - name: Test formatting, errors and platform
        run: pnpm test:format

      - name: Test appearance preferences
        run: pnpm test:appearance

      - name: Test dashboard store and selectors
        run: pnpm test:dashboard

      - name: Test result messages and icon validation
        run: pnpm test:messages

      - name: Test permissions catalog
        run: pnpm test:permissions

      - name: Test projects summary
        run: pnpm test:projects

      - name: Test UI boundaries
        run: pnpm test:ui

      - name: Test Graphify query cache isolation
        run: pnpm test:graph

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .graphify-version

      - name: Install pinned Graphify
        run: python -m pip install "graphifyy==$(cat .graphify-version)"

      - name: Verify knowledge graph is current
        run: pnpm graph:check

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Verify the bundle has no showcase or sidebar cookie
        run: 'test ! -e dist/showcase.html && ! grep -rq "sidebar_state" dist'

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
