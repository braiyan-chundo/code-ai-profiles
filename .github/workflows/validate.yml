name: Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify release versioning
        run: |
          npm run release:check
          npm run test:release

      - name: Test scan controller
        run: npm run test:scan

      - name: Test source update controller
        run: npm run test:update

      - name: Test formatting, errors and platform
        run: npm run test:format

      - name: Test appearance preferences
        run: npm run test:appearance

      - name: Test dashboard store and selectors
        run: npm run test:dashboard

      - name: Test result messages and icon validation
        run: npm run test:messages

      - name: Test Graphify query cache isolation
        run: npm run test:graph

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .graphify-version

      - name: Install pinned Graphify
        run: python -m pip install "graphifyy==$(cat .graphify-version)"

      - name: Verify knowledge graph is current
        run: npm run graph:check

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
