name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-14
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg
            artifact_name: code-ai-profiles-macos-arm64
            artifact_path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          - name: Windows x64
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles msi,nsis
            artifact_name: code-ai-profiles-windows-x64
            artifact_path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: Linux x64
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
            artifact_name: code-ai-profiles-linux-x64
            artifact_path: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            tauri_args: --target aarch64-unknown-linux-gnu --bundles deb,appimage
            artifact_name: code-ai-profiles-linux-arm64
            artifact_path: |
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.tauri_args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # Solo con un tag `v*`: junta los instaladores de las cuatro variantes en una Release en borrador, con las notas de
  # su sección del CHANGELOG. La publica el mantenedor a mano después de revisarla; este job no publica nada.
  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Check tag against the app version
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -r .version package.json)"
          if [ "$version" != "$app_version" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con la versión de la app ($app_version)."
            exit 1
          fi

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md no tiene la sección [$version]."
            exit 1
          fi

      - name: Download installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir dist

      - name: Create draft release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0 | sort -z)
          if [ "${#files[@]}" -ne 7 ]; then
            echo "Se esperaban 7 instaladores (dmg, msi, exe y deb + AppImage por arquitectura de Linux) y hay ${#files[@]}."
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Code AI Profiles ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            "${files[@]}"
