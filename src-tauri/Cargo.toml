[package]
name = "code-ai-profiles"
version = "0.2.0"
description = "Isolated desktop AI application profile manager"
authors = ["Code AI Profiles contributors"]
edition = "2021"

[lib]
name = "code_ai_profiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
tauri = { version = "2", features = ["protocol-asset"] }
sysinfo = "0.37"
uuid = { version = "1", features = ["v4", "serde"] }
