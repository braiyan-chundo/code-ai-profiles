<style>
  :root { --shell-bg:#f6f6f7; --shell-fg:#1d1d1f; --shell-muted:#6e6e73; --shell-line:#e3e3e6; --shell-accent:#3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --shell-bg:#161618; --shell-fg:#f2f2f3; --shell-muted:#9a9aa1; --shell-line:#2c2c30; --shell-accent:#748ffc; } }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.4 system-ui, sans-serif; background: var(--shell-bg); color: var(--shell-fg); display:grid; grid-template-columns: 240px 1fr; height:100vh; }
  body.sin-panel { grid-template-columns: 1fr; } body.sin-panel aside { display:none; }
  aside { border-right:1px solid var(--shell-line); padding:16px; overflow:auto; }
  aside h1 { font-size:13px; margin:0 0 16px; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--shell-muted); margin:18px 0 6px; }
  aside button { display:block; width:100%; text-align:left; background:none; border:0; color:inherit; padding:5px 8px; border-radius:6px; cursor:pointer; font:inherit; }
  aside button[aria-pressed="true"] { background: color-mix(in srgb, var(--shell-accent) 14%, transparent); color: var(--shell-accent); font-weight:600; }
  aside button[hidden] { display:none; }
  .fila { display:flex; gap:4px; flex-wrap:wrap; } .fila button { width:auto; }
  main { overflow:auto; padding:24px; display:flex; gap:24px; justify-content:center; align-items:flex-start; }
  .marco { display:flex; flex-direction:column; gap:6px; flex:none; }
  .marco .rotulo { font-size:12px; color:var(--shell-muted); } .marco .rotulo b { color:var(--shell-fg); }
  .caja { overflow:hidden; border:1px solid var(--shell-line); border-radius:10px; background:#fff; }
  iframe { border:0; display:block; transform-origin: 0 0; }
  .nota { color:var(--shell-muted); font-size:12px; margin-top:8px; }
  #mostrar { position:fixed; top:10px; left:10px; display:none; border:1px solid var(--shell-line); background:var(--shell-bg); color:inherit; border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; font-size:12px; }
  body.sin-panel #mostrar { display:block; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { border-right:0; border-bottom:1px solid var(--shell-line); } }
</style>

/* ── 1. Tokens de la app: copia de src/styles/tokens.css y de los --ui-* de src/styles/ui-theme.css (HU-0016).
      Oscuro es la base; claro va después. data-tema hace aquí lo que .theme-dark / .theme-light en la app. ── */
:root, [data-tema="oscuro"] {
  color-scheme: dark;
  --surface:#151615; --surface-raised:rgba(33,34,33,.9); --surface-soft:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.14);
  --text:#e8e4e2; --muted:#aaa19e; --quiet:#726b68;
  --primary:#ff8d6c; --primary-bright:#ff5f35; --primary-soft:#ffb19b; --danger:#ef7e70;
  --ui-on-primary:#fff; --ui-primary-text:var(--primary); --ui-popover:rgba(43,44,43,.98);
  --ui-window:linear-gradient(145deg, rgba(28,29,28,.985), rgba(16,17,16,.99));
  --ui-window-border:rgba(255,255,255,.11);
  --ui-window-shadow:0 40px 100px rgba(0,0,0,.56), inset 0 1px 0 rgba(255,255,255,.045);
  --ui-window-close:#c42b1c; --ui-success:#84ab8c; --ui-warning:#cf9a5e;
  /* La marca: text-(--primary-soft) en oscuro, text-primary-text en claro (Titlebar.tsx) */
  --marca:var(--primary-soft);
}
[data-tema="claro"] {
  color-scheme: light;
  --surface:#f3efeb; --surface-raised:rgba(255,255,255,.92); --surface-soft:rgba(63,46,39,.055);
  --line:rgba(66,48,40,.11); --line-strong:rgba(66,48,40,.17);
  --text:#2e2926; --muted:#746b67; --quiet:#9b928d; --danger:#be4f42;
  --ui-primary-text:#9c5947; --ui-popover:rgba(255,253,251,.995);
  --ui-window:linear-gradient(145deg, rgba(249,247,244,.995), rgba(235,229,224,.995));
  --ui-window-border:rgba(68,46,38,.14);
  --ui-window-shadow:0 40px 100px rgba(75,54,45,.22), inset 0 1px rgba(255,255,255,.8);
  --ui-success:#3f7a52; --ui-warning:#94601f;
  --marca:var(--ui-primary-text);
}
/* Puente shadcn (ui-theme.css): radios 9, 12, 14, 16, 20 y anillo de tarjeta foreground/10. */
:root { --radius-sm:9px; --radius-md:12px; --radius-lg:14px; --radius-xl:16px; --radius-2xl:20px;
  --anillo:0 0 0 1px color-mix(in srgb, var(--text) 10%, transparent); --font-sans:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --font-mono:"JetBrains Mono", ui-monospace, monospace; }

/* ── 2. PROPUESTA D-3 · escala tipográfica global. Base 13 / 14 / 16 px y mínimo 11 px.
      Hoy solo cambia --session-* (6–14 px); aquí cambia todo el texto y la altura de los controles. ── */
:root, [data-letra="normal"] {
  --fs-micro:11px; --fs-small:12px; --fs-body:14px; --fs-heading:15px; --fs-title:17px; --fs-figure:22px; --esc:1;
}
[data-letra="compacto"] { --fs-micro:11px; --fs-small:11px; --fs-body:13px; --fs-heading:14px; --fs-title:15px; --fs-figure:20px; --esc:.93; }
[data-letra="grande"]   { --fs-micro:12px; --fs-small:14px; --fs-body:16px; --fs-heading:17px; --fs-title:19px; --fs-figure:26px; --esc:1.143; }
:root { --h-ctl:calc(36px * var(--esc)); --h-ctl-sm:calc(32px * var(--esc)); --h-badge:calc(20px * var(--esc)); --ic:calc(16px * var(--esc)); }

/* ── 3. PROPUESTA D-1 / D-2 · medidas del marco ── */
:root {
  --alto:920px;            /* la ventana: 1440×920; a 980 de ancho, 980×680 */
  --barra:52px;            /* A y C: una sola barra (hoy 94 px en macOS + 89 px de cabecera) */
  --col-sb:256px;          /* columna del sidebar: panel de 240 px + 8 px de margen a cada lado (hoy 260 pegado) */
  --sb-m:8px;              /* margen del panel flotante */
  --pad-x:32px;            /* margen lateral del contenido (hoy 38 px) */
  --estado-h:36px;         /* barra de estado (hoy 52 px) */
  --ctl-izq:16px;          /* hueco a la izquierda de la barra: Windows y Linux */
}
[data-plataforma="macos"] { --ctl-izq:84px; }  /* semáforos en x:20 (3 × 12 px + 2 × 8 px) + 12 px de aire */
@media (max-width:1070px) { :root { --pad-x:24px; } }   /* hoy 25 px */
@media (max-width:1000px) { :root { --alto:680px; --estado-h:32px; } }
[data-sidebar="plegado"], [data-sidebar="tooltip"] { --col-sb:64px; }  /* 48 px de panel (3rem del catálogo) + 2 × 8 */
[data-variante="B"] { --barra:40px; }

/* ── 4. Componentes, con el aspecto del catálogo (src/components/ui) ── */
* { box-sizing:border-box; }
html, body { margin:0; }
body { font-family:var(--font-sans); font-size:var(--fs-body); line-height:1.45; color:var(--text); background:var(--surface); -webkit-font-smoothing:antialiased; }
h1, h2, h3, p { margin:0; }
a { color:inherit; text-decoration:none; }
.mono { font-family:var(--font-mono); }

/* La ventana */
.win { position:relative; height:var(--alto); overflow:hidden; background:var(--ui-window); display:grid;
  grid-template-columns:var(--col-sb) minmax(0,1fr); grid-template-rows:var(--barra) minmax(0,1fr);
  grid-template-areas:"tb cab" "sb main"; }
[data-variante="B"] .win { grid-template-rows:var(--barra) 48px minmax(0,1fr); grid-template-areas:"tb tb" "sb cab" "sb main"; }
[data-plataforma="windows"] .win { border-radius:var(--radius-2xl); border:1px solid var(--ui-window-border); }

/* Controles nativos. Los semáforos son el dibujo del control de macOS (no son tokens de la app). */
.semaforos { display:none; position:absolute; z-index:3; left:20px; top:calc(var(--barra) / 2 - 6px); gap:8px; }
[data-plataforma="macos"] .semaforos { display:flex; }
.semaforos i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2); }
.semaforos i:nth-child(1) { background:#ff5f57; } .semaforos i:nth-child(2) { background:#febc2e; } .semaforos i:nth-child(3) { background:#28c840; }
.ctl-win { display:none; position:absolute; z-index:3; top:0; right:10px; }
[data-plataforma="windows"] .ctl-win { display:flex; }
.ctl-win span { display:grid; place-items:center; width:46px; height:36px; border-radius:0 0 7px 7px; color:var(--muted); --ic:16px; }
.ctl-win span:last-child.hover { background:var(--ui-window-close); color:#fff; }

/* Zona de la barra sobre el sidebar: hueco de la plataforma, el plegado y, en B, la marca */
.tb { grid-area:tb; position:relative; z-index:2; display:flex; align-items:center; gap:8px; padding-left:var(--ctl-izq); min-width:0; }
[data-variante="B"] .tb { border-bottom:1px solid var(--line); }
[data-variante="C"] .win > .tb, [data-variante="C"] .cab { border-bottom:1px solid var(--line); }
.trigger { display:grid; place-items:center; width:32px; height:32px; border-radius:var(--radius-md); color:var(--muted); flex:none; }
.marca-b { display:none; align-items:center; gap:8px; }
[data-variante="B"] .marca-b { display:flex; }

/* La marca */
.marca-ic { color:var(--marca); --ic:20px; }
.marca-txt { font-size:var(--fs-heading); font-weight:700; letter-spacing:-.04em; white-space:nowrap; }
.beta { font-family:var(--font-mono); font-size:var(--fs-micro); line-height:1; font-weight:600; letter-spacing:.1em; color:var(--muted); border:1px solid var(--line-strong); border-radius:5px; padding:3px 5px 2px; }

/* Cabecera de la página: en A y C dentro de la barra; en B, su propia franja de 48 px */
.cab { grid-area:cab; display:flex; align-items:center; justify-content:space-between; gap:16px; min-width:0; padding:0 var(--pad-x); }
[data-plataforma="windows"]:not([data-variante="B"]) .cab { padding-right:160px; }
[data-plataforma="macos"]:is([data-sidebar="plegado"],[data-sidebar="tooltip"]):not([data-variante="B"]) .cab { padding-left:68px; }
.migas { display:flex; align-items:center; gap:6px; min-width:0; white-space:nowrap; }
.migas .pre { color:var(--muted); font-size:var(--fs-body); font-weight:500; }
.migas .sep { color:var(--quiet); --ic:14px; }
.migas h1 { font-size:var(--fs-title); line-height:1.25; font-weight:600; letter-spacing:-.025em; overflow:hidden; text-overflow:ellipsis; }
.acciones { display:flex; align-items:center; gap:8px; flex:none; }

/* Botón (button.tsx): default, outline, destructive, ghost; tamaños default (h-9), sm (h-8), lg (h-10), icon */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--h-ctl); padding:0 12px; border-radius:var(--radius-md); border:1px solid transparent; font-size:var(--fs-body); font-weight:500; white-space:nowrap; color:var(--text); flex:none; }
.btn.pri { background:var(--primary-bright); color:var(--ui-on-primary); }
.btn.out { border-color:var(--line-strong); background:color-mix(in srgb, var(--line-strong) 30%, transparent); }
[data-tema="claro"] .btn.out { border-color:var(--line); background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.05); }
.btn.tono { border-color:color-mix(in srgb, var(--primary-bright) 30%, transparent); background:color-mix(in srgb, var(--primary-bright) 10%, transparent); color:var(--ui-primary-text); }
.btn.sm { height:var(--h-ctl-sm); border-radius:10px; padding:0 10px; }
.btn.lg { height:calc(40px * var(--esc)); padding:0 16px; }
.btn.ic-only { width:var(--h-ctl); padding:0; }
.btn.lg.ic-only { width:calc(40px * var(--esc)); }
.btn.fant { color:var(--muted); width:var(--h-ctl-sm); height:var(--h-ctl-sm); padding:0; }
.solo-ancho { display:inline; }
@media (max-width:1070px) { .btn.contrae .solo-ancho { display:none; } .btn.contrae { width:var(--h-ctl); padding:0; } }

/* Badge (badge.tsx) en la forma de la app: mono, mayúsculas */
.bd { display:inline-flex; align-items:center; gap:5px; height:var(--h-badge); padding:0 8px; border-radius:999px; border:1px solid transparent; font-family:var(--font-mono); font-size:var(--fs-micro); line-height:1; font-weight:600; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; flex:none; }
.bd.sec { background:var(--surface-soft); color:var(--text); }
.bd.run { color:var(--ui-primary-text); border-color:color-mix(in srgb, var(--primary-bright) 30%, transparent); background:color-mix(in srgb, var(--primary-bright) 10%, transparent); }
.bd.stop { color:var(--muted); border-color:var(--line-strong); }
.bd.pri { color:var(--ui-primary-text); border-color:color-mix(in srgb, var(--primary-bright) 30%, transparent); }
.bd .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.bd.stop .dot { background:var(--quiet); }

/* ── El sidebar (D-2): panel flotante con margen, radio 14 y su superficie; plegado, un panel de 48 px ── */
.sb { grid-area:sb; min-height:0; padding:var(--sb-m); }
.panel { position:relative; height:100%; display:flex; flex-direction:column; background:var(--surface-raised); border-radius:var(--radius-lg); box-shadow:var(--anillo), 0 1px 2px rgba(0,0,0,.05); }
[data-variante="C"] .sb { padding:0; }
[data-variante="C"] .panel { border-radius:0; background:var(--surface-soft); box-shadow:none; border-right:1px solid var(--line-strong); }
.sb-marca { display:flex; align-items:center; gap:8px; padding:12px 12px 6px; }
.sb-marca .marca-txt { font-size:var(--fs-title); }
[data-variante="B"] .sb-marca { display:none; }
.sb-buscar { position:relative; display:flex; align-items:center; gap:8px; height:var(--h-ctl-sm); margin:6px 8px 4px; padding:0 8px 0 10px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface-soft); color:var(--muted); }
[data-variante="B"] .sb-buscar { margin-top:8px; }
.sb-buscar .ph { flex:1; white-space:nowrap; overflow:hidden; }
.kbd { font-family:var(--font-sans); font-size:var(--fs-micro); line-height:1; color:var(--muted); background:var(--line); border-radius:5px; padding:3px 5px; }
.sb-scroll { flex:1; min-height:0; padding:4px 8px; display:flex; flex-direction:column; gap:2px; }
.sb-grupo { font-size:var(--fs-micro); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:12px 8px 6px; }
.sb-item { position:relative; display:flex; align-items:center; gap:10px; height:var(--h-ctl-sm); padding:0 8px; border-radius:10px; font-size:var(--fs-body); white-space:nowrap; cursor:pointer; }
.sb-item > span:not(.av) { flex:1; overflow:hidden; text-overflow:ellipsis; }
.sb-item.activo { background:var(--line); font-weight:500; }
.sb-item.nueva { color:var(--ui-primary-text); }
.sb-item.vacio { color:var(--muted); font-size:var(--fs-small); cursor:default; }
.cnt { font-style:normal; font-family:var(--font-mono); font-size:var(--fs-micro); font-weight:600; color:var(--muted); min-width:calc(20px * var(--esc)); height:calc(20px * var(--esc)); padding:0 6px; border-radius:999px; background:var(--surface-soft); display:inline-grid; place-items:center; }
.sb-item.activo .cnt { background:var(--line-strong); color:var(--text); }
.av { position:relative; display:grid; place-items:center; flex:none; color:var(--marca); }
.av .punto { position:absolute; right:-3px; bottom:-3px; width:8px; height:8px; border-radius:50%; background:var(--quiet); box-shadow:0 0 0 2px var(--surface); }
.av .punto.on { background:var(--primary); box-shadow:0 0 0 2px var(--surface), 0 0 6px var(--primary); }
.sb-pie { border-top:1px solid var(--line); padding:8px; display:flex; flex-direction:column; gap:2px; }
.tip { display:none; position:absolute; z-index:5; left:calc(100% + 14px); top:50%; transform:translateY(-50%); background:var(--text); color:var(--surface); font-size:var(--fs-small); font-weight:500; padding:6px 12px; border-radius:var(--radius-md); white-space:nowrap; }
.tip::before { content:""; position:absolute; left:-4px; top:50%; width:10px; height:10px; background:inherit; border-radius:2px; transform:translateY(-50%) rotate(45deg); }

/* Plegado a iconos: 48 px de panel, entradas de 32 px centradas, sin textos; las secciones, una raya */
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-marca { justify-content:center; padding:12px 0 8px; }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) :is(.sb-marca .marca-txt, .sb-marca .beta, .sb-buscar, .cnt, .sb-item.vacio) { display:none; }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-scroll, :is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-pie { padding:4px 8px; align-items:center; }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-item { width:var(--h-ctl-sm); padding:0; justify-content:center; }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-item > span:not(.av) { display:none; }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-grupo { font-size:0; padding:0; margin:10px auto; width:20px; height:1px; background:var(--line-strong); }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-grupo:first-child { display:none; }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-pie { border-top:0; }
[data-sidebar="tooltip"] .sb-item.con-tip { background:var(--line); }
[data-sidebar="tooltip"] .sb-item.con-tip .tip { display:block; }

/* ── El contenido ── */
.main { grid-area:main; min-height:0; display:grid; grid-template-rows:minmax(0,1fr) var(--estado-h); }
.contenido { min-height:0; overflow:hidden; padding:var(--sb-m) var(--pad-x) 24px; }
.pila { max-width:1200px; margin:0 auto; display:grid; gap:16px; }
.estado { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 var(--pad-x); border-top:1px solid var(--line); font-size:var(--fs-micro); color:var(--muted); white-space:nowrap; overflow:hidden; }
.estado .izq, .estado .der { display:flex; align-items:center; gap:14px; }
.estado .ok { color:var(--ui-primary-text); font-weight:700; letter-spacing:.12em; display:inline-flex; align-items:center; gap:6px; }
.estado .ok::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.estado .div { width:1px; height:14px; background:var(--line); }
.estado .der { font-family:var(--font-mono); font-weight:500; letter-spacing:.1em; }
.estado .pt { width:4px; height:4px; border-radius:50%; background:color-mix(in srgb, var(--primary) 60%, transparent); }
.estado .ic { --ic:14px; }
.plat { display:none; } [data-plataforma="macos"] .plat.mac, [data-plataforma="windows"] .plat.win-p, [data-plataforma="linux"] .plat.lin { display:inline; }
@media (max-width:1070px) { .estado .ancho { display:none; } }

/* Tarjeta (card.tsx, size sm) */
.card { background:var(--surface-raised); border-radius:var(--radius-xl); box-shadow:var(--anillo), 0 1px 2px rgba(0,0,0,.05); padding:16px; display:grid; gap:16px; }
.card-cab { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.card-tit { font-size:var(--fs-heading); font-weight:600; display:flex; align-items:center; gap:8px; }
.card-tit .ic { color:var(--muted); }
.card-desc { font-size:var(--fs-small); color:var(--muted); margin-top:2px; }

/* Aviso (NoticeAlert sobre alert.tsx) */
.aviso { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:var(--radius-lg); border:1px solid var(--line); background:var(--surface-soft); }
.aviso > .ic { color:var(--text); }
.aviso .txt { flex:1; min-width:0; }
.aviso b { display:block; font-size:var(--fs-body); font-weight:500; }
.aviso small { display:block; font-size:var(--fs-small); color:var(--muted); }

/* Cifras (SummaryCards): 5 en fila; por debajo de 1071 px, 3 + 2 */
.cifras { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; }
@media (max-width:1070px) { .cifras { grid-template-columns:repeat(6, minmax(0,1fr)); } .cifras > :nth-child(-n+3) { grid-column:span 2; } .cifras > :nth-child(n+4) { grid-column:span 3; } }
.cifra { background:var(--surface-raised); border-radius:var(--radius-xl); box-shadow:var(--anillo); padding:16px; display:grid; gap:8px; min-width:0; }
.etq { font-size:var(--fs-micro); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px; line-height:1.2; }
.etq .vivo { width:6px; height:6px; border-radius:50%; background:var(--primary); box-shadow:0 0 6px var(--primary); }
.cifra strong { font-family:var(--font-mono); font-size:var(--fs-figure); line-height:1; font-weight:600; letter-spacing:-.05em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cifra span.pista { font-size:var(--fs-small); color:var(--muted); line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Fila de uso (UsageRanking: item.tsx outline + UsageBar) */
.filas { display:grid; gap:8px; }
.fila-uso { display:flex; align-items:center; gap:14px; padding:10px 12px; border-radius:var(--radius-md); border:1px solid var(--line); background:var(--surface-soft); cursor:pointer; }
.avatar { position:relative; display:grid; place-items:center; flex:none; width:calc(32px * var(--esc)); height:calc(32px * var(--esc)); border-radius:var(--radius-lg); border:1px solid var(--line-strong); background:var(--surface-soft); color:var(--marca); --ic:calc(20px * var(--esc)); }
.avatar .punto { position:absolute; right:-3px; bottom:-3px; width:9px; height:9px; border-radius:50%; background:var(--quiet); box-shadow:0 0 0 2px var(--surface); }
.avatar .punto.on { background:var(--primary); box-shadow:0 0 0 2px var(--surface), 0 0 6px var(--primary); }
.avatar.xl { width:64px; height:64px; border-radius:var(--radius-2xl); --ic:36px; }
.avatar.xl .punto { width:14px; height:14px; right:-4px; bottom:-4px; }
.quien { flex:1; min-width:0; display:grid; gap:4px; }
.quien .nom { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; white-space:nowrap; font-size:var(--fs-body); font-weight:500; }
.quien .meta { font-family:var(--font-mono); font-size:var(--fs-small); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.barra-uso { width:34%; flex:none; display:grid; gap:6px; }
@media (max-width:1070px) { .barra-uso { width:30%; } }
.barra-uso .top { display:flex; justify-content:space-between; align-items:baseline; }
.barra-uso .val { font-family:var(--font-mono); font-size:var(--fs-small); font-weight:600; color:var(--ui-primary-text); }
.pista-b { height:4px; border-radius:999px; background:var(--line); overflow:hidden; }
.pista-b i { display:block; height:100%; background:var(--muted); border-radius:inherit; }
.pista-b i.alto { background:var(--primary-bright); }
.pista-b i.ok { background:var(--ui-success); } .pista-b i.medio { background:var(--ui-warning); }

/* Vacío (EmptyState sobre empty.tsx) */
.vacio-c { border:1px dashed var(--line-strong); border-radius:var(--radius-xl); background:var(--surface-soft); padding:48px 24px; display:grid; justify-items:center; text-align:center; gap:10px; }
.vacio-c .media { width:44px; height:44px; border-radius:var(--radius-md); background:var(--surface-soft); border:1px solid var(--line); display:grid; place-items:center; color:var(--text); --ic:22px; }
.vacio-c h2 { font-size:var(--fs-heading); font-weight:600; }
.vacio-c p { font-size:var(--fs-small); color:var(--muted); max-width:440px; }

/* Detalle de instancia y de la original */
.heroe { display:flex; align-items:center; flex-wrap:wrap; gap:16px 20px; }
.card.run { box-shadow:0 0 0 1px color-mix(in srgb, var(--primary-bright) 30%, transparent), 0 1px 2px rgba(0,0,0,.05); }
.heroe .datos { flex:1 1 240px; min-width:0; display:grid; gap:8px; }
.heroe .chips { display:flex; flex-wrap:wrap; gap:8px; }
.heroe .ruta { font-family:var(--font-mono); font-size:var(--fs-small); font-weight:500; color:var(--muted); }
.heroe .ver { font-family:var(--font-mono); font-size:var(--fs-small); color:var(--muted); line-height:1; }
.mini { border:1px solid var(--line-strong); border-radius:var(--radius-md); padding:7px 12px; display:grid; gap:3px; }
.mini .etq { font-family:var(--font-mono); font-weight:500; letter-spacing:.08em; }
.mini b { font-family:var(--font-mono); font-size:var(--fs-body); font-weight:600; }
.medidores { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.medidor { background:var(--surface-raised); border-radius:var(--radius-xl); box-shadow:var(--anillo); padding:16px; display:grid; gap:10px; }
.medidor .top { display:flex; justify-content:space-between; align-items:center; }
.medidor .num { font-family:var(--font-mono); font-size:var(--fs-figure); font-weight:600; letter-spacing:-.05em; color:var(--ui-primary-text); line-height:1; }
.medidor .pista-b { height:8px; }
.medidor .pie { text-align:right; font-family:var(--font-mono); font-size:var(--fs-micro); color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.captura { text-align:right; font-family:var(--font-mono); font-size:var(--fs-small); color:var(--muted); margin-top:-8px; }

/* Sesión (SessionItem): ahora con la escala global en lugar de --session-* */
.sesion { display:flex; gap:14px; align-items:flex-start; padding:12px; border-radius:var(--radius-md); border:1px solid var(--line); background:var(--surface-soft); }
.sesion .caja-ic { display:grid; place-items:center; flex:none; width:calc(32px * var(--esc)); height:calc(32px * var(--esc)); border-radius:var(--radius-lg); border:1px solid var(--line); background:var(--surface-soft); color:var(--muted); }
.sesion .cuerpo { flex:1; min-width:0; display:grid; gap:6px; }
.sesion .tit { font-size:var(--fs-body); font-weight:600; }
.sesion .meta { font-family:var(--font-mono); font-size:var(--fs-small); color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.sesion .meta i.s { width:3px; height:3px; border-radius:50%; background:var(--quiet); }
.ctx { display:grid; gap:5px; }
.ctx .top { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:var(--fs-micro); color:var(--muted); }
.ctx .top b { font-weight:600; }
.ctx .top b.ok { color:var(--ui-success); } .ctx .top b.medio { color:var(--ui-warning); }
.ctx small { font-family:var(--font-mono); font-size:var(--fs-micro); color:var(--muted); }
.ctx small.medio { color:var(--ui-warning); }
.sesion .acc { display:flex; align-items:center; gap:8px; align-self:center; }

/* Pantalla de la escala */
.doc { padding:32px 40px; max-width:1100px; }
.doc h1 { font-size:22px; font-weight:600; letter-spacing:-.03em; margin-bottom:6px; }
.doc > p { color:var(--muted); font-size:14px; margin-bottom:20px; }
.doc table { width:100%; border-collapse:collapse; font-size:13px; }
.doc th { text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line-strong); }
.doc td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
.doc td.n { font-family:var(--font-mono); font-size:12px; }
.doc td.n, .doc td:last-child { white-space:nowrap; }
[data-letra="compacto"] .doc td:nth-child(4), [data-letra="normal"] .doc td:nth-child(5), [data-letra="grande"] .doc td:nth-child(6) { color:var(--ui-primary-text); font-weight:600; background:color-mix(in srgb, var(--primary-bright) 8%, transparent); }
.doc .mu { color:var(--muted); }

/* ══════════ HU-0023 · Proyectos. Solo tokens de la app; los colores de estado son los que ya existen:
   en curso = terracota (--primary), en espera = --ui-warning, terminada = --ui-success, descartada = --quiet. ══════════ */
:root, [data-tema="oscuro"] { --ui-overlay:rgba(5,6,5,.58); }
[data-tema="claro"] { --ui-overlay:rgba(67,50,43,.3); }
:root, [data-letra="normal"] { --fs-dialog:22px; } [data-letra="compacto"] { --fs-dialog:20px; } [data-letra="grande"] { --fs-dialog:25px; }
:root { --e-curso:var(--primary); --e-espera:var(--ui-warning); --e-term:var(--ui-success); --e-desc:var(--quiet); }
[data-sidebar="desplegado"] .sb-scroll { overflow:hidden; }
/* Monograma del proyecto: la inicial, sin color propio (no hay paleta por proyecto) */
.mono-p { display:grid; place-items:center; flex:none; width:calc(18px * var(--esc)); height:calc(18px * var(--esc)); border-radius:5px; border:1px solid var(--line-strong); background:var(--surface-soft); font-family:var(--font-mono); font-style:normal; font-size:var(--fs-micro); font-weight:700; line-height:1; color:var(--muted); }
.sb-item.activo .mono-p { color:var(--text); }
.mono-p.roto { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, transparent); }
.mono-p.lg { width:calc(40px * var(--esc)); height:calc(40px * var(--esc)); border-radius:var(--radius-md); font-size:var(--fs-heading); --ic:20px; }
.mono-p.xl { width:64px; height:64px; border-radius:var(--radius-2xl); font-size:24px; letter-spacing:-.02em; --ic:30px; }
.sb-item .alerta { color:var(--danger); --ic:14px; }
.sb-item.roto > span { color:var(--muted); }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-item .alerta { display:none; }

/* Fila de herramientas sobre la lista */
.barra-lista { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:var(--fs-small); color:var(--muted); }
.barra-lista .ic { --ic:14px; }
.barra-lista span { display:inline-flex; align-items:center; gap:6px; }

/* Tarjetas de proyecto */
.proyectos { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:16px; }
.pcard { display:flex; flex-direction:column; gap:14px; cursor:pointer; }
.pc-cab { display:flex; align-items:flex-start; gap:12px; }
.pc-tit { flex:1; min-width:0; display:grid; gap:3px; }
.pc-tit h2 { font-size:var(--fs-heading); font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ruta-m { font-family:var(--font-mono); font-size:var(--fs-small); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.pc-pie { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:12px; border-top:1px solid var(--line); font-size:var(--fs-small); color:var(--muted); }
.pc-pie span { display:inline-flex; align-items:center; gap:6px; }
.pc-pie .ic { --ic:14px; }
.pc-msg { font-size:var(--fs-small); color:var(--muted); }
.pcard.roto { box-shadow:0 0 0 1px color-mix(in srgb, var(--danger) 35%, transparent); cursor:default; }
.bd.err { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 35%, transparent); background:color-mix(in srgb, var(--danger) 8%, transparent); }
.bd.ok { color:var(--ui-success); border-color:color-mix(in srgb, var(--ui-success) 40%, transparent); }
.bd.warn { color:var(--ui-warning); border-color:color-mix(in srgb, var(--ui-warning) 40%, transparent); }

/* Reparto de historias por estado: una barra apilada y su leyenda (mismos 4 colores en todas partes) */
.reparto { display:grid; gap:8px; }
.rep-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.rep-num { font-size:var(--fs-small); color:var(--muted); }
.rep-num b { font-family:var(--font-mono); font-size:var(--fs-heading); font-weight:600; color:var(--text); margin-right:4px; }
.barra-est { display:flex; gap:2px; height:6px; border-radius:999px; overflow:hidden; background:var(--line); }
.barra-est i { display:block; height:100%; }
.e-curso { background:var(--e-curso); } .e-espera { background:var(--e-espera); } .e-term { background:var(--e-term); } .e-desc { background:var(--e-desc); }
.leyenda { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:var(--fs-small); color:var(--muted); }
.leyenda span { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.leyenda b { font-family:var(--font-mono); font-weight:600; color:var(--text); }
.pt-e { width:8px; height:8px; border-radius:2px; flex:none; }
.tec { display:inline-flex; align-items:center; height:var(--h-badge); padding:0 8px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface-soft); font-size:var(--fs-small); color:var(--text); white-space:nowrap; }
.tec.pack { font-family:var(--font-mono); font-size:var(--fs-micro); color:var(--muted); }

/* La página del proyecto */
.contenido.scroll { overflow:auto; }
.heroe-p { display:flex; align-items:flex-start; gap:20px; }
.heroe-p .datos { flex:1; min-width:0; display:grid; gap:10px; }
.heroe-p .resumen { font-size:var(--fs-body); color:var(--text); max-width:760px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.heroe-p .meta-p { display:flex; flex-wrap:wrap; gap:6px 20px; font-size:var(--fs-small); color:var(--muted); }
.heroe-p .meta-p span { display:inline-flex; align-items:center; gap:6px; min-width:0; }
.heroe-p .meta-p .ic { --ic:14px; }
.heroe-p .meta-p .mono { color:var(--muted); }
.heroe-p .meta-p b { color:var(--text); font-weight:500; }
.heroe-p .acciones { align-self:flex-start; }
@media (max-width:1070px) { .heroe-p { flex-wrap:wrap; } .heroe-p .acciones { width:100%; justify-content:flex-start; padding-left:84px; } }

.kpis { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:12px; }
.kpis .ancha { grid-column:span 2; }
@media (max-width:1070px) { .kpis { grid-template-columns:repeat(4, minmax(0,1fr)); } .kpis .ancha { grid-column:span 4; } }
.cifra .barra-est { margin-top:2px; }
.kpis .cifra { align-content:start; }

.dos { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:16px; align-items:start; }
@media (max-width:1070px) { .dos { grid-template-columns:1fr; } }
.tec-grupos { display:grid; gap:12px; margin:0; }
.tec-grupos > div { display:grid; grid-template-columns:120px 1fr; gap:8px; align-items:start; }
.tec-grupos dt { padding-top:4px; }
.tec-grupos dd { margin:0; display:flex; flex-wrap:wrap; gap:6px; }
.fuente { font-size:var(--fs-small); color:var(--muted); display:flex; align-items:center; gap:6px; }
.fuente .ic { --ic:14px; }

.repos { display:grid; gap:8px; }
.repo { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.4fr); gap:14px; align-items:center; padding:10px 12px; border-radius:var(--radius-md); border:1px solid var(--line); background:var(--surface-soft); }
.repo .c { display:grid; gap:4px; min-width:0; }
.repo .nom { display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:var(--fs-body); font-weight:600; white-space:nowrap; }
.repo .sub { font-family:var(--font-mono); font-size:var(--fs-small); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
.repo .sub .ic { --ic:14px; flex:none; }
.repo .sub .tx { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.repo .tecr { font-size:var(--fs-small); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.repo .rama { color:var(--text); }
[data-variante="sin-git"] .git { display:none; }
[data-variante="sin-git"] .repo { grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); }

/* Pestañas de filtro (tabs.tsx, variante segmentada) */
.seg { display:inline-flex; gap:2px; padding:3px; border-radius:var(--radius-md); background:var(--surface-soft); border:1px solid var(--line); flex-wrap:wrap; }
.seg span { display:inline-flex; align-items:center; gap:6px; height:calc(28px * var(--esc)); padding:0 10px; border-radius:9px; font-size:var(--fs-small); font-weight:500; color:var(--muted); white-space:nowrap; cursor:pointer; }
.seg span.on { background:var(--surface-raised); color:var(--text); box-shadow:var(--anillo), 0 1px 2px rgba(0,0,0,.08); }
.seg em { font-style:normal; font-family:var(--font-mono); font-size:var(--fs-micro); font-weight:600; color:var(--muted); }
.seg .pt-e { width:7px; height:7px; border-radius:50%; }

/* Tabla de historias (table.tsx) */
.tabla { width:100%; border-collapse:collapse; table-layout:fixed; font-size:var(--fs-body); }
.tabla th { text-align:left; font-size:var(--fs-micro); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:0 10px 8px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
.tabla td { padding:0 10px; height:calc(40px * var(--esc)); border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
.tabla tr:last-child td { border-bottom:0; }
.tabla .n { text-align:right; font-family:var(--font-mono); font-size:var(--fs-small); }
.tabla td.n { color:var(--text); }
.tabla td.n.vac { color:var(--muted); }
.tabla .id { font-family:var(--font-mono); font-size:var(--fs-small); color:var(--muted); margin-right:8px; }
.tabla .mu { color:var(--muted); font-size:var(--fs-small); }
.tabla col.c-est { width:132px; } .tabla col.c-fase { width:140px; } .tabla col.c-area { width:132px; } .tabla col.c-fecha { width:76px; } .tabla col.c-t { width:76px; } .tabla col.c-k { width:88px; }
@media (max-width:1070px) { .tabla .c-area, .tabla .c-fecha, .tabla td.area, .tabla td.fecha, .tabla th.area, .tabla th.fecha { display:none; } .tabla col.c-est { width:124px; } .tabla col.c-fase { width:112px; } }
.est { display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-small); white-space:nowrap; }
.est .pt-e { width:8px; height:8px; border-radius:50%; }
.est.desc { color:var(--muted); }
.pie-tabla { display:flex; justify-content:space-between; gap:12px; font-size:var(--fs-small); color:var(--muted); padding:4px 10px 0; }

/* Consumo: barras horizontales de un solo color, ordenadas */
.consumo { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:24px; }
@media (max-width:1070px) { .consumo { grid-template-columns:1fr; } }
.consumo h3 { margin-bottom:10px; }
.barras { display:grid; gap:8px; }
.bar-f { display:grid; grid-template-columns:minmax(0,46%) minmax(0,1fr) 76px; gap:12px; align-items:center; font-size:var(--fs-small); }
.bar-f .lbl { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-f .lbl .pt-e { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:8px; vertical-align:1px; }
.bar-f .lbl .id { font-family:var(--font-mono); color:var(--muted); margin-right:6px; }
.bar-f .pista-b { height:8px; }
.bar-f .pista-b i { background:var(--muted); }
.bar-f .val { text-align:right; font-family:var(--font-mono); font-weight:600; }
.bar-f .val small { font-weight:400; color:var(--muted); }
.barras.rol .bar-f { grid-template-columns:120px minmax(0,1fr) 112px; }
.nota-c { font-size:var(--fs-small); color:var(--muted); margin-top:10px; }

/* Diálogo (dialog.tsx): velo con desenfoque de 18 px, panel de 580 px, radio 26 */
.velo { position:absolute; inset:0; z-index:8; background:var(--ui-overlay); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
.dlg { position:absolute; z-index:9; left:50%; top:50%; transform:translate(-50%,-50%); width:min(580px, calc(100% - 32px)); display:grid; gap:20px; padding:28px; border-radius:26px; background:var(--ui-popover); box-shadow:var(--anillo), var(--ui-window-shadow); }
.dlg h2 { font-size:var(--fs-dialog); line-height:1.15; font-weight:600; letter-spacing:-.035em; }
.dlg .desc { font-size:var(--fs-small); color:var(--muted); margin-top:6px; }
.dlg .x { position:absolute; top:16px; right:16px; color:var(--muted); width:32px; height:32px; display:grid; place-items:center; border-radius:10px; }
.dlg-carpeta { display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--radius-lg); border:1px solid var(--line); background:var(--surface-soft); }
.dlg-carpeta .c { flex:1; min-width:0; display:grid; gap:3px; }
.dlg-carpeta b.n { font-size:var(--fs-heading); font-weight:600; }
.checks { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.checks li { display:flex; align-items:center; gap:10px; font-size:var(--fs-body); }
.checks li > span { flex:1; min-width:0; }
.checks li em { font-style:normal; font-size:var(--fs-small); color:var(--muted); white-space:nowrap; }
.checks li.ok > .ic { color:var(--ui-success); }
.checks li.no > .ic { color:var(--danger); }
.checks code { font-family:var(--font-mono); font-size:var(--fs-small); }
.dlg .nota-l { display:flex; align-items:flex-start; gap:8px; font-size:var(--fs-small); color:var(--muted); }
.dlg .nota-l .ic { --ic:14px; margin-top:2px; }
.dlg-pie { display:flex; justify-content:flex-end; gap:8px; }
.aviso.warn { border-color:color-mix(in srgb, var(--ui-warning) 40%, transparent); background:color-mix(in srgb, var(--ui-warning) 8%, transparent); }
.aviso.warn > .ic { color:var(--ui-warning); }
.aviso.err { border-color:color-mix(in srgb, var(--danger) 40%, transparent); background:color-mix(in srgb, var(--danger) 7%, transparent); }
.aviso.err > .ic { color:var(--danger); }

/* ══════════ Sistema armónico (el mismo que HU-0022). Retícula de 4 px; espaciado solo 4 · 8 · 12 · 16 · 24 · 32 · 48;
   interlineado múltiplo de 4; radios 8 · 12 · 16 · 20 · 24 con radio interior = exterior − padding (mínimo 8);
   controles de 24 · 32 · 36 · 40; iconos 16 con el cuerpo y 20 con los títulos.
   Excepciones medidas y justificadas: bordes de 1 px, el hueco de 2 px entre segmentos de una barra (dataviz),
   el hueco de los semáforos de macOS (84 px, fijado por la plataforma) y los dibujos de controles nativos. ══════════ */
:root {
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:16px; --radius-2xl:20px; --radius-dlg:24px; --radius-in:8px;
  --lh-micro:16px; --lh-small:16px; --lh-body:20px; --lh-heading:20px; --lh-title:24px; --lh-figure:28px; --lh-dialog:28px;
}
[data-letra="compacto"] { --lh-title:20px; }
[data-letra="grande"] { --lh-small:20px; --lh-body:24px; --lh-heading:24px; --lh-figure:32px; --lh-dialog:32px; }
body { line-height:var(--lh-body); }
/* Interlineado por papel */
.etq, .bd, .kbd, .beta, .cnt, .estado, .seg em, .tec.pack, .tabla th, .mono-p, .sec-cifra { line-height:var(--lh-micro); }
.card-desc, .ruta-m, .pc-msg, .pc-pie, .leyenda, .tec, .fuente, .repo .sub, .repo .tecr, .seg span, .tabla .id, .tabla .mu, .tabla .n, .est,
.pie-tabla, .bar-f, .nota-c, .dlg .desc, .checks em, .checks code, .dlg .nota-l, .aviso small, .cifra span.pista, .barra-lista, .heroe-p .meta-p,
.vacio-c p, .tip, .sb-item.vacio, .ctx, .captura { line-height:var(--lh-small); }
.sb-item, .btn, .tabla, .checks li, .aviso b, .heroe-p .resumen, .migas .pre, .sb-buscar, .repo .nom { line-height:var(--lh-body); }
.card-tit, .pc-tit h2, .vacio-c h2, .dlg-carpeta b.n, .rep-num, .marca-txt { line-height:var(--lh-heading); }
.migas h1, .sb-marca .marca-txt { line-height:var(--lh-title); }
.cifra strong { line-height:var(--lh-figure); }
.dlg h2 { line-height:var(--lh-dialog); }
.bar-f .val small { font-size:var(--fs-micro); }

/* Marco heredado de HU-0019, llevado a la escala */
.trigger { border-radius:var(--radius-sm); }
.migas { gap:var(--s-2); } .migas .sep { --ic:16px; }
.btn { gap:var(--s-2); }
.btn.sm { border-radius:var(--radius-sm); padding:0 var(--s-3); }
.bd { gap:var(--s-1); }
.kbd { padding:0 var(--s-1); border-radius:4px; }
.beta { padding:0 var(--s-1); border-radius:4px; }
.sb-marca { padding:var(--s-3) var(--s-3) var(--s-1); }
.sb-buscar { margin:var(--s-2) var(--s-2) var(--s-1); padding:0 var(--s-2) 0 var(--s-3); gap:var(--s-2); border-radius:var(--radius-sm); }
.sb-scroll { gap:0; padding:var(--s-1) var(--s-2); }
.sb-grupo { padding:var(--s-3) var(--s-2) var(--s-1); }
.sb-item { gap:var(--s-2); border-radius:var(--radius-sm); flex:none; }   /* panel 16 − margen 8 = 8 */
.sb-item .alerta { --ic:16px; }
[data-sidebar="desplegado"] .sb-scroll { -webkit-mask-image:linear-gradient(#000 calc(100% - 24px), transparent); mask-image:linear-gradient(#000 calc(100% - 24px), transparent); }
.sb-pie { padding:var(--s-2); gap:0; }
.cnt { padding:0 var(--s-1); }
.tip { padding:var(--s-1) var(--s-3); border-radius:var(--radius-sm); left:calc(100% + 16px); }
.estado, .estado .izq, .estado .der { gap:var(--s-4); }
.estado .ic { --ic:16px; }
:is([data-sidebar="plegado"],[data-sidebar="tooltip"]) .sb-grupo { margin:var(--s-3) auto; }

/* Tarjetas: un padding por nivel. Sección = 24; cifra = 16. Radio 16; lo de dentro que toca el borde, 8. */
.card { padding:var(--s-5); gap:var(--s-4); }
.card-desc { margin-top:var(--s-1); }
.card-tit .ic { --ic:20px; }
.cifra { padding:var(--s-4); gap:var(--s-2); align-content:start; }
.etq { gap:var(--s-2); }
.aviso { border-radius:var(--radius-lg); }
.vacio-c { gap:var(--s-3); }
.vacio-c .media { width:40px; height:40px; border-radius:var(--radius-md); --ic:20px; }

/* Pila: secciones a 32; dentro de una sección, 16–24 */
.pila.secciones { gap:var(--s-6); }
.pila.lista { gap:var(--s-4); }

/* Lista de proyectos: 2 columnas de 6/12 con gutter 24; misma altura por fila; el pie siempre abajo */
.proyectos { gap:var(--s-5); }
.pcard { display:grid; grid-template-rows:auto auto auto 1fr; gap:var(--s-4); }
.pcard.roto { grid-template-rows:auto auto 1fr; }
.pcard .pc-pie { margin-top:0; align-self:end; padding-top:var(--s-4); }
.pc-tit { gap:var(--s-1); }
.pc-pie span, .barra-lista span { gap:var(--s-2); }
.pc-pie .ic, .barra-lista .ic, .heroe-p .meta-p .ic, .fuente .ic, .repo .sub .ic, .dlg .nota-l .ic { --ic:16px; }
.chips { gap:var(--s-2); }
.leyenda span { gap:var(--s-2); }
.tec { border-radius:var(--radius-sm); }

/* Inicial del proyecto: cuadrados de la escala (16 = icono, 40 = control lg, 64 = avatar de la página de instancia) */
.mono-p { width:calc(16px * var(--esc)); height:calc(16px * var(--esc)); border-radius:4px; }
.mono-p.lg { width:calc(40px * var(--esc)); height:calc(40px * var(--esc)); border-radius:var(--radius-md); --ic:20px; }
.mono-p.xl { width:64px; height:64px; border-radius:var(--radius-lg); --ic:32px; }

/* Barra por estados: 8 de alto, extremos de 4, huecos de 2 (dataviz) */
.barra-est { height:8px; border-radius:4px; background:transparent; }
/* «En espera» con trama a 45° y marcador hueco: en oscuro su tono queda a ΔE 8,8 de «en curso» (1,8 para protanopía) */
.barra-est i.e-espera { background:repeating-linear-gradient(135deg, var(--e-espera) 0 3px, color-mix(in srgb, var(--e-espera) 35%, transparent) 3px 6px); }
.pt-e.e-espera { background:transparent; box-shadow:inset 0 0 0 2px var(--e-espera); }
[data-tema="claro"] { --e-curso:var(--primary-bright); }   /* #ff8d6c da 2,2:1 sobre blanco; #ff5f35, 3,0:1 */

/* Página del proyecto */
.heroe-p { display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:var(--s-5); align-items:start; }
.heroe-p .datos { gap:var(--s-3); }
.heroe-p .meta-p { gap:var(--s-2) var(--s-5); }
.heroe-p .meta-p span { gap:var(--s-2); }
@media (max-width:1070px) { .heroe-p { grid-template-columns:64px minmax(0,1fr); } .heroe-p .acciones { grid-column:2; width:auto; padding-left:0; } }

/* Retícula de 12 columnas, gutter 24: cifras 4+2+2+2+2; Tecnologías 5 y Repos 7; consumo 7 y 5 */
.kpis, .dos, .consumo { grid-template-columns:repeat(12, minmax(0,1fr)); gap:var(--s-5); }
.kpis > .cifra { grid-column:span 2; } .kpis > .ancha { grid-column:span 4; }
.dos { align-items:stretch; } .dos > :first-child { grid-column:span 5; } .dos > :last-child { grid-column:span 7; }
.consumo > .col-h { grid-column:span 7; } .consumo > .col-r { grid-column:span 5; }
.consumo > div { display:grid; gap:var(--s-3); align-content:start; }
.consumo h3 { margin:0; }
@media (max-width:1070px) {
  .kpis > .ancha { grid-column:span 12; } .kpis > .cifra:not(.ancha) { grid-column:span 3; }
  .dos > :first-child, .dos > :last-child, .consumo > .col-h, .consumo > .col-r { grid-column:span 12; }
}
.sec-cifra { font-size:var(--fs-micro); color:var(--muted); font-family:var(--font-mono); }
.sec-cifra b { color:var(--text); font-weight:600; }
.fuente { gap:var(--s-2); }
.repo { padding:var(--s-3); gap:var(--s-4); border-radius:var(--radius-in); }
.repo .sub { gap:var(--s-2); }
.seg { padding:var(--s-1); gap:var(--s-1); border-radius:var(--radius-md); }
.seg span { height:calc(24px * var(--esc)); padding:0 var(--s-2); border-radius:var(--radius-sm); gap:var(--s-2); }   /* 12 − 4 = 8 */
.est { gap:var(--s-2); }

/* Tabla alineada a la retícula: la tabla se extiende 12 px a cada lado y cada celda lleva 12 + 12 = el gutter de 24 */
.tabla { width:calc(100% + 24px); margin:0 -12px; }
.tabla th { padding:0 var(--s-3) var(--s-2); }
.tabla td { padding:0 var(--s-3); }
.tabla col.c-hu { width:calc(100% * 4 / 12); } .tabla col.c-est { width:calc(100% * 2 / 12); } .tabla col.c-fase { width:calc(100% * 2 / 12); }
.tabla col.c-area { width:calc(100% * 2 / 12); } .tabla col.c-t { width:calc(100% / 12); } .tabla col.c-k { width:calc(100% / 12); }
@media (max-width:1070px) {
  .tabla col.c-hu { width:calc(100% * 4 / 12); } .tabla col.c-est { width:calc(100% * 2 / 12); } .tabla col.c-fase { width:calc(100% * 2 / 12); }
  .tabla col.c-t { width:calc(100% * 2 / 12); } .tabla col.c-k { width:calc(100% * 2 / 12); }
}
.tabla tr.no-suma td.n { color:var(--muted); text-decoration:line-through; text-decoration-color:var(--quiet); }
.pie-tabla { padding:var(--s-2) 0 0; flex-wrap:wrap; }
.bar-f { grid-template-columns:minmax(0,1fr) minmax(0,1fr) 80px; gap:var(--s-3); }
.barras.rol .bar-f { grid-template-columns:120px minmax(0,1fr) 112px; }
.bar-f .pista-b { border-radius:4px; } .bar-f .pista-b i { border-radius:4px; }
.nota-c { margin-top:0; }

/* Diálogo: radio 24, padding 24; lo que toca el borde interior, 24 − 24 → mínimo 8 */
.dlg { padding:var(--s-5); gap:var(--s-5); border-radius:var(--radius-dlg); }
.dlg .x { border-radius:var(--radius-sm); }
.dlg .desc { margin-top:var(--s-1); }
.dlg-carpeta { border-radius:var(--radius-in); }
.dlg .aviso { border-radius:var(--radius-in); }
.checks { gap:var(--s-3); } .checks li { gap:var(--s-2); }
.dlg .nota-l { gap:var(--s-2); } .dlg .nota-l .ic { margin-top:0; }
.bar-f .lbl .id, .tabla .id { margin-right:var(--s-2); }
.tec-grupos dd { gap:var(--s-2); }
.pt-e, .seg .pt-e, .est .pt-e { border-radius:50%; }
.estado .ok { gap:var(--s-2); }
.cifra .barra-est { margin-top:0; }
.dlg-carpeta .c { gap:var(--s-1); }
.card { align-content:start; }
.sec-cifra { display:grid; }
.kpis .cifra span.pista { white-space:normal; }
.barras.rol .bar-f { grid-template-columns:120px minmax(0,1fr) 136px; }


/* ══════════ HU-0025 · Datos incompletos y lector de historias. Sin colores nuevos: neutros y --ui-warning.
   Misma escala que HU-0022: espaciado 4·8·12·16·24·32·48, radios 8·12·16·24, interlineado múltiplo de 4. ══════════ */
:root { --fs-prose:14px; --lh-prose:24px; }
[data-letra="compacto"] { --fs-prose:13px; --lh-prose:20px; }
[data-letra="grande"] { --fs-prose:16px; --lh-prose:28px; }

/* Chip de la cabecera (D-1 ★): un botón en la fila de chips; discreto, con el aviso real en --ui-warning */
.chip-inc { display:inline-flex; align-items:center; gap:var(--s-2); height:calc(24px * var(--esc)); padding:0 var(--s-3) 0 var(--s-2); border-radius:999px; border:1px solid var(--line-strong); background:var(--surface-soft); font-size:var(--fs-small); line-height:var(--lh-small); font-weight:500; color:var(--text); white-space:nowrap; cursor:pointer; flex:none; }
.chip-inc .ic { --ic:16px; color:var(--muted); }
.chip-inc .pt { color:var(--quiet); }
.chip-inc b { font-weight:600; color:var(--ui-primary-text); }
.chip-inc.warn { border-color:color-mix(in srgb, var(--ui-warning) 40%, transparent); }
.chip-inc.warn .ic { color:var(--ui-warning); }
.chip-inc:hover { background:var(--line); }
.chip-inc.foco { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--primary-bright); }
/* Alternativa D-1 (variante B): una tarjeta plegada bajo la cabecera */
.franja-inc { display:none; }
[data-variante="franja"] .chip-inc { display:none; }
[data-variante="franja"] .franja-inc { display:flex; align-items:center; gap:var(--s-3); min-height:48px; padding:var(--s-2) var(--s-4); border-radius:var(--radius-lg); background:var(--surface-raised); box-shadow:var(--anillo), 0 1px 2px rgba(0,0,0,.05); cursor:pointer; font-size:var(--fs-body); line-height:var(--lh-body); }
.franja-inc > .ic:first-child { color:var(--muted); }
.franja-inc.warn > .ic:first-child { color:var(--ui-warning); }
.franja-inc .txt { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 var(--s-2); }
.franja-inc b { font-weight:500; }
.franja-inc small { font-size:var(--fs-small); line-height:var(--lh-small); color:var(--muted); }
.franja-inc .ver { display:inline-flex; align-items:center; gap:var(--s-1); font-size:var(--fs-small); font-weight:600; color:var(--ui-primary-text); }

/* Filas de la tabla: clicables, con la etiqueta discreta (borde discontinuo = «falta», sin color de alarma) */
.tabla tr.fila-hu { cursor:pointer; }
.tabla tr.fila-hu:hover td, .tabla tr.fila-hu.hov td { background:var(--surface-soft); }
.tabla tr.fila-hu.hov td:first-child { border-radius:var(--radius-in) 0 0 var(--radius-in); }
.tabla tr.fila-hu.hov td:last-child { border-radius:0 var(--radius-in) var(--radius-in) 0; }
.tabla td.falta { overflow:visible; }
.tabla td.falta .inc { vertical-align:middle; }
.celda { display:flex; align-items:center; gap:var(--s-2); min-width:0; }
.celda .id { margin:0; flex:none; }
.celda .tt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.inc { font-family:var(--font-sans); flex:none; display:inline-flex; align-items:center; height:var(--h-badge); padding:0 var(--s-2); border-radius:var(--radius-sm); border:1px dashed var(--line-strong); font-size:var(--fs-micro); line-height:var(--lh-micro); font-weight:500; color:var(--muted); white-space:nowrap; }
.inc.foco, .fila-hu.foco td:first-child { box-shadow:inset 0 0 0 2px var(--primary-bright); }
.tabla tr.no-suma .tt { color:var(--muted); }

/* Diálogo con cabecera, cuerpo que se desplaza (ScrollArea) y pie fijos: padding 0 y 24 en cada banda */
.dlg.ancho, .dlg.lector { padding:0; gap:0; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; }
.dlg.ancho { width:min(640px, calc(100% - 32px)); max-height:calc(100% - 64px); }
.dlg.lector { width:min(960px, calc(100% - 48px)); height:calc(100% - 48px); grid-template-rows:auto auto minmax(0,1fr) auto; }
.dlg-cab { padding:var(--s-5) var(--s-7) var(--s-4) var(--s-5); display:grid; gap:var(--s-1); }
.dlg-cuerpo { position:relative; min-height:0; overflow:hidden; border-top:1px solid var(--line); }
.dlg-cuerpo > .rueda { overflow:hidden; padding:var(--s-2) var(--s-5) var(--s-5); display:grid; gap:0; align-content:start; }
.dlg-cuerpo::after { content:""; position:absolute; left:0; right:0; bottom:0; height:var(--s-5); background:linear-gradient(transparent, var(--ui-popover)); pointer-events:none; }
.dlg-cuerpo.sin-fundido::after { display:none; }
/* Scrollbar del ScrollArea (scroll-area.tsx): carril de 10 con pulgar redondo en bg-border */
.sa-bar { position:absolute; z-index:2; top:0; right:0; bottom:0; width:10px; padding:1px; border-left:1px solid transparent; }
.sa-bar i { display:block; width:100%; border-radius:999px; background:var(--line-strong); }
.dlg-pie2 { display:flex; align-items:center; justify-content:space-between; gap:var(--s-4); padding:var(--s-4) var(--s-5); border-top:1px solid var(--line); }
.dlg-pie2 .nota-l { display:flex; align-items:center; gap:var(--s-2); font-size:var(--fs-small); line-height:var(--lh-small); color:var(--muted); min-width:0; }
.dlg-pie2 .nota-l .tx { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.dlg-pie2 .nota-l .ic { --ic:16px; flex:none; }
.dlg .x { top:var(--s-4); right:var(--s-4); z-index:3; }
.dlg-cab .desc { margin-top:var(--s-1); }

/* Grupos del modal «Datos incompletos» */
.grupo { display:grid; gap:var(--s-3); padding:var(--s-5) 0; border-top:1px solid var(--line); }
.grupo:first-child { border-top:0; padding-top:var(--s-4); }
.grupo-cab { display:flex; align-items:center; gap:var(--s-2); min-height:var(--h-ctl-sm); }
.grupo-cab .ic { --ic:20px; color:var(--muted); }
.grupo-cab h3 { font-size:var(--fs-heading); line-height:var(--lh-heading); font-weight:600; }
.grupo-cab .sp { flex:1; }
.grupo.avisos .grupo-cab .ic { color:var(--ui-warning); }
.grupo .expl { font-size:var(--fs-small); line-height:var(--lh-small); color:var(--muted); }
.grupo .expl b { color:var(--text); font-weight:500; }
.cmd-lista { display:grid; gap:var(--s-2); }
.cmd-item { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--s-1) var(--s-3); align-items:center; padding:var(--s-3); border:1px solid var(--line); background:var(--surface-soft); border-radius:var(--radius-in); }
.cmd-item .tt { display:flex; align-items:baseline; gap:var(--s-2); min-width:0; font-size:var(--fs-body); line-height:var(--lh-body); }
.cmd-item .tt .id { font-family:var(--font-mono); font-size:var(--fs-small); line-height:var(--lh-small); color:var(--muted); flex:none; }
.cmd-item .tt .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.cmd-item code { grid-column:1; display:block; font-family:var(--font-mono); font-size:var(--fs-small); line-height:var(--lh-small); color:var(--text); background:var(--line); border-radius:4px; padding:var(--s-1) var(--s-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cmd-item .btn { min-width:112px; grid-column:2; grid-row:1 / span 2; }
.btn.copiado { color:var(--ui-success); border-color:color-mix(in srgb, var(--ui-success) 40%, transparent); }
.sin-lista { border:1px solid var(--line); background:var(--surface-soft); border-radius:var(--radius-in); padding:var(--s-1) 0; }
.sin-fila { display:flex; align-items:center; gap:var(--s-2); min-height:32px; padding:0 var(--s-3); font-size:var(--fs-small); line-height:var(--lh-small); }
.sin-fila + .sin-fila { border-top:1px solid var(--line); }
.sin-fila .id { font-family:var(--font-mono); color:var(--muted); flex:none; width:64px; }
.sin-fila .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-body); }
.sin-fila .k { font-family:var(--font-mono); color:var(--muted); flex:none; }

    <div class="lec-cab"><div style="display:grid;gap:var(--s-1)"><span class="id">HU-0023</span><h2>Reserva de puestos por equipo</h2></div>
      <div class="chips"><span class="est"><i class="pt-e e-term"></i>Terminada</span><span class="bd sec">Cierre</span><span class="bd stop">reservas</span><span class="pc-msg" style="font-size:var(--fs-small);line-height:var(--lh-small)">Creada el 14 oct</span><span class="inc" title="Falta metricas.json">Sin métricas</span></div></div>
    <div class="lec-tabs"><div class="seg" role="tablist"><span class="on" role="tab" aria-selected="true">hu.md</span><span class="" role="tab" aria-selected="false">arquitectura.md</span><span class="" role="tab" aria-selected="false">verificacion.md</span><span class="" role="tab" aria-selected="false">seguimiento.md</span></div></div>
    <div class="lec-cuerpo"><div class="sa-bar"><i style="height:34%"></i></div><div class="rueda"><div class="md">
        <p>Como <strong>responsable de equipo</strong> quiero reservar varios puestos contiguos para que mi gente trabaje junta los días de presencia, sin tener que reservar uno por uno.</p>
        <blockquote><p>Los lunes y miércoles el equipo de producto acaba repartido en tres plantas.</p><p>— Marta Ruiz, 14 oct</p></blockquote>
        <h2>Alcance</h2>
        <ul>
          <li>Reservar entre 2 y 12 puestos <strong>contiguos</strong> de una misma planta.</li>
          <li>Ver en el mapa qué zonas tienen hueco para el tamaño del equipo, según la <a>guía de reservas<i class="ic i-external-link"></i></a>.</li>
          <li>Liberar los puestos que no se vayan a usar:
            <ul><li>a mano, hasta las 09:00 del mismo día;</li><li>de forma automática, si nadie ha hecho el check-in.</li></ul></li>
        </ul>
        <h2>Criterios de aceptación</h2>
        <h3>AC-01 · Reserva de equipo</h3>
        <p>Con un equipo elegido, la persona indica día y número de puestos, y la aplicación propone la zona <code>contigua</code> más cercana al mapa.</p>
        <div class="tabla-md"><table>
          <thead><tr><th>Rol</th><th>Reservar</th><th>Cancelar</th><th>Ver ocupación</th></tr></thead>
          <tbody>
            <tr><td>Responsable de equipo</td><td>Sí, hasta 12</td><td>Sí</td><td>Su equipo</td></tr>
            <tr><td>Persona del equipo</td><td>No</td><td>Solo su puesto</td><td>Su equipo</td></tr>
            <tr><td>Recepción</td><td>Sí, sin límite</td><td>Sí</td><td>Toda la planta</td></tr>
          </tbody></table></div>
        <h3>AC-02 · Conflictos</h3>
        <ol>
          <li>Si no hay zona contigua libre, se ofrece la opción <strong>más cercana</strong> con el número de puestos separados.</li>
          <li>Si dos responsables piden a la vez la misma zona, gana quien confirmó primero.</li>
          <li>Ninguna reserva de equipo se puede solapar con otra del mismo día.</li>
        </ol>
        <div class="cb-cod"><div class="cb-cab"><span>http</span><span class="btn fant" aria-label="Copiar el código"><i class="ic i-copy"></i></span></div><pre><span class="k">POST</span> /api/reservas/equipo
{
  <span class="s">"equipo"</span>: <span class="s">"producto"</span>,
  <span class="s">"dia"</span>: <span class="s">"2026-10-21"</span>,
  <span class="s">"puestos"</span>: 6
}</pre></div>
        <h2>Definición de terminado</h2>
        <ul class="tareas">
          <li class="tarea"><i class="cb on"><i class="ic i-check"></i></i><span>Criterios AC-01 y AC-02 probados.</span></li>
          <li class="tarea"><i class="cb on"><i class="ic i-check"></i></i><span>Documentación de la API actualizada.</span></li>
          <li class="tarea"><i class="cb"></i><span>Probado con tres equipos reales.</span></li>

        <h1>Arquitectura</h1>
        <p>La reserva de equipo es <strong>una reserva con varios puestos</strong>: no se crean N reservas sueltas. Así cancelar al equipo es una sola operación.</p>
        <h2>Modelo de datos</h2>
        <div class="cb-cod"><div class="cb-cab"><span>sql</span><span class="btn fant" aria-label="Copiar el código"><i class="ic i-copy"></i></span></div><pre><span class="k">CREATE TABLE</span> reserva_equipo (
  id          <span class="k">uuid</span> <span class="k">PRIMARY KEY</span>,
  equipo_id   <span class="k">uuid</span> <span class="k">NOT NULL</span>,
  dia         <span class="k">date</span> <span class="k">NOT NULL</span>,
  planta      <span class="k">smallint</span> <span class="k">NOT NULL</span>,
  <span class="c">-- puestos contiguos, ordenados por posición</span>
  puestos     <span class="k">uuid[]</span> <span class="k">NOT NULL</span>
);</pre></div>
        <h2>Decisiones</h2>
        <ul>
          <li><strong>D-1.</strong> La contigüidad se calcula en el servidor, con la geometría de <code>mapa_planta</code>.</li>
          <li><strong>D-2.</strong> La liberación automática es un trabajo programado cada 15 minutos.</li>
        </ul>
        <blockquote><p>Alternativa descartada: reservar puestos sueltos y marcarlos «de equipo». Obliga a reconstruir el grupo al cancelar.</p></blockquote>
        <h2>Riesgos</h2>
        <div class="tabla-md"><table>
          <thead><tr><th>Riesgo</th><th>Impacto</th><th>Mitigación</th></tr></thead>
          <tbody>
            <tr><td>Doble reserva simultánea</td><td>Medio</td><td>Restricción única por puesto y día</td></tr>
            <tr><td>Mapa desactualizado</td><td>Bajo</td><td>Versión del mapa en cada reserva</td></tr>
          </tbody></table></div>

function documento(t, variante) {
  const atributos = [`data-tema="${estado.tema}"`, `data-variante="${variante}"`, ...ejes.map((e) => `data-${e.id}="${estado[e.id]}"`)].join(" ");
  return `<!doctype html><html lang="es" ${atributos}><head><meta charset="utf-8"><style>${$("tokens").textContent}[data-ir]{cursor:pointer}</style></head>` +
    `<body>${t ? t.innerHTML : "<p style='padding:16px'>Falta esta combinación.</p>"}</body></html>`;
}
function ir(destino) {
  for (const [k, v] of new URLSearchParams(destino)) if (k in estado) estado[k] = k === "ancho" ? Number(v) : v;
  pintar();
}
function marco(variante, escala) {
  const v = variantes.find((x) => x.id === variante);
  const fijo = MAQUETA.altos?.[estado.ancho];
  const alto = fijo ? fijo * escala : innerHeight - 80;
  const div = document.createElement("div");
  div.className = "marco";
  if (estado.comparar === "si") div.innerHTML = `<div class="rotulo"><b>${v.nombre}</b>${v.nota ? " · " + v.nota : ""}</div>`;
  const caja = document.createElement("div");
  caja.className = "caja";
  caja.style.width = estado.ancho * escala + "px";
  caja.style.height = alto + "px";
  const f = document.createElement("iframe");
  f.title = `Pantalla, variante ${v.nombre}`;
  f.style.width = estado.ancho + "px";
  f.style.height = alto / escala + "px";
  f.style.transform = `scale(${escala})`;
  f.srcdoc = documento(plantilla(variante), variante);
  f.onload = () => f.contentDocument.addEventListener("click", (e) => {
    const el = e.target.closest("[data-ir]");
    if (el) { e.preventDefault(); if (estado.comparar === "si") estado.variante = variante; ir(el.dataset.ir); }
  });
  caja.append(f);
  div.append(caja);
  return div;
}
function pintar() {
  // HU-0025: si el estado no existe en esta pantalla, el primero que sí.
  const propios = plantillas().filter((t) => t.dataset.pantalla === estado.pantalla).map((t) => t.dataset.estado);
  if (propios.length && !propios.includes(estado.estado)) estado.estado = propios[0];
  const lista = estado.comparar === "si" && variantes.length > 1 ? variantes.map((v) => v.id) : [estado.variante];
  const disponible = $("escena").clientWidth - 48 - 24 * (lista.length - 1);
  const escala = Math.min(1, disponible / (estado.ancho * lista.length));
  $("escena").replaceChildren(...lista.map((v) => marco(v, escala)));
  // Solo los estados dibujados en la pantalla elegida.
  const dibujados = new Set(plantillas().filter((t) => t.dataset.pantalla === estado.pantalla).map((t) => t.dataset.estado));
  for (const b of $("estados").children) b.hidden = !dibujados.has(b.dataset.valor);
  for (const [grupo, clave] of [["pantallas", "pantalla"], ["estados", "estado"], ["anchos", "ancho"], ["variantes", "variante"], ["temas", "tema"], ...ejes.map((e) => [`eje-${e.id}`, e.id])])
    for (const b of $(grupo).children) b.setAttribute("aria-pressed", String(b.dataset.valor === String(estado[clave])));
  $("comparar").setAttribute("aria-pressed", String(estado.comparar === "si"));
  $("comparar").hidden = variantes.length < 2;
  $("notaVariante").textContent = variantes.find((v) => v.id === estado.variante)?.nota ?? "";
  escribirHash();
}
function botones(grupo, clave, items) {
  for (const it of items) {
    const b = document.createElement("button");
    b.textContent = it.nombre ?? String(it.id ?? it);
    b.dataset.valor = String(it.id ?? it);
    b.onclick = () => { estado[clave] = clave === "ancho" ? Number(b.dataset.valor) : b.dataset.valor; pintar(); };
    $(grupo).append(b);
  }
}
$("titulo").textContent = MAQUETA.titulo;
botones("pantallas", "pantalla", MAQUETA.pantallas);
botones("estados", "estado", MAQUETA.estados);
botones("anchos", "ancho", MAQUETA.anchos.map((a) => ({ id: a, nombre: MAQUETA.altos?.[a] ? `${a}×${MAQUETA.altos[a]}` : String(a) })));
botones("variantes", "variante", variantes);
for (const e of ejes) {
  const h = document.createElement("h2"); h.textContent = e.nombre;
  const d = document.createElement("div"); d.id = `eje-${e.id}`; d.className = "fila";
  $("ejes").append(h, d);
  botones(d.id, e.id, e.valores);
}
botones("temas", "tema", [{ id: "claro", nombre: "Claro" }, { id: "oscuro", nombre: "Oscuro" }]);
$("comparar").onclick = () => { estado.comparar = estado.comparar === "si" ? "no" : "si"; pintar(); };
$("ocultar").onclick = () => { document.body.classList.add("sin-panel"); pintar(); };
$("mostrar").onclick = () => { document.body.classList.remove("sin-panel"); pintar(); };
leerHash();
pintar();
addEventListener("hashchange", () => { leerHash(); pintar(); });
addEventListener("resize", pintar);
</script>
</body>
</html>
